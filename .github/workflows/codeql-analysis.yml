name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # The previous workflow set paths-ignore directly under "with",
          # where it is not a recognised input, so it never took effect.
          # Generated output is not source and should not be analysed.
          config: |
            paths-ignore:
              - docs
              - _site
              - dist
              - coverage
              - coverage-ts
              - test/fixture

      # No autobuild step: this is an interpreted-language analysis, and the
      # previous config ran it needlessly.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
