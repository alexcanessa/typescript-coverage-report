name: Docs

# The demo linked from the README is the tool run on itself. It used to be
# committed output under docs/, regenerated by hand: by the time this replaced
# it, the published page was eighteen months stale and still listed React
# components that had been deleted.
#
# Generating it on every push to main also makes the public demo a continuous,
# real-world smoke test of the HTML reporter.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  build:
    name: Build coverage demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # --threshold 0 so a coverage dip never blocks the docs deploy; the CI
      # build job is what enforces the 90% gate.
      - run: pnpm run type-coverage --outputDir _site --threshold 0
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
